name: Scrape & Schedule Facebook Posts

on:
  schedule:
    # Chạy lúc 05:00, 12:00, 19:00 giờ Việt Nam (UTC+7) = 22:00, 05:00, 12:00 UTC
    # Cửa sổ quét: 19h→5h (10h) | 5h→12h (7h) | 12h→19h (7h) — khép kín cả ngày
    - cron: '0 22,5,12 * * *'
  workflow_dispatch:    # Cho phép chạy thủ công từ GitHub UI
    inputs:
      clear_dedup:
        description: 'Xóa dedup trước khi chạy (để đăng lại bài cũ)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          github-token: ${{ github.token }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tạo Facebook cookies file
        env:
          FACEBOOK_COOKIES: ${{ secrets.FACEBOOK_COOKIES }}
        run: |
          if [ -n "$FACEBOOK_COOKIES" ]; then
            echo "$FACEBOOK_COOKIES" > /tmp/fb_cookies.txt
            echo "FACEBOOK_COOKIE_FILE=/tmp/fb_cookies.txt" >> $GITHUB_ENV
          fi

      - name: Xóa dedup (nếu được yêu cầu)
        if: ${{ github.event.inputs.clear_dedup == 'true' }}
        env:
          DB_BACKEND: sheets
          GOOGLE_WEBAPP_URL: ${{ secrets.GOOGLE_WEBAPP_URL }}
          WEBAPP_SECRET: ${{ secrets.WEBAPP_SECRET }}
        run: |
          python -c "
          import os, httpx
          url = os.environ['GOOGLE_WEBAPP_URL']
          secret = os.environ['WEBAPP_SECRET']
          r = httpx.post(url, params={'token': secret}, json={'action': 'clear_dedup'}, follow_redirects=True, timeout=30)
          print('clear_dedup:', r.status_code, r.text[:200])
          r2 = httpx.post(url, params={'token': secret}, json={'action': 'clear_schedule'}, follow_redirects=True, timeout=30)
          print('clear_schedule:', r2.status_code, r2.text[:200])
          "

      - name: Run scrape + pending review job
        env:
          DB_BACKEND: sheets
          GOOGLE_WEBAPP_URL: ${{ secrets.GOOGLE_WEBAPP_URL }}
          WEBAPP_SECRET: ${{ secrets.WEBAPP_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          LOG_LEVEL: INFO
        run: python -m src.main_scrape
